[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icd10-local-mcp"
version = "0.1.0"
description = "Local, deterministic ICD-10-CM coder-review prototype, not for clinical use"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28,<1",
    "defusedxml>=0.7.1",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
icd10-catalog = "icd10_mcp.cli:main"
icd10-mcp = "icd10_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/icd10_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: opt-in integration tests requiring the complete supplied CDC archives",
    "openmed: opt-in synthetic checks against staged real OpenMed weights",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
